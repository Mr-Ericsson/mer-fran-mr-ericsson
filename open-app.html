<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0D12" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Öppna app — Mr Ericsson</title>
    <link rel="stylesheet" href="styles.css?v=9" />
    <style>
      .open-card {
        margin: 48px 20px 24px;
        padding: 28px 22px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--bg-2);
        text-align: center;
      }
      .open-card h1 {
        font-family: Syne, Manrope, sans-serif;
        font-size: 1.35rem;
        margin: 0 0 10px;
      }
      .open-card p {
        margin: 0 0 22px;
        color: var(--ink-muted);
        line-height: 1.45;
        font-size: 0.95rem;
      }
      .open-card .btn {
        display: inline-flex;
        width: 100%;
        justify-content: center;
        margin-bottom: 12px;
        text-decoration: none;
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      .open-card .btn-ghost {
        background: transparent;
        color: var(--ink-muted);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="open-card">
        <h1 id="title">Öppna appen</h1>
        <p id="msg">Laddar…</p>
        <button type="button" class="btn" id="retry">Öppna igen</button>
        <a class="btn btn-ghost" href="index.html">Tillbaka till katalogen</a>
      </main>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var app = (params.get("app") || "").toLowerCase();
        var titleEl = document.getElementById("title");
        var msgEl = document.getElementById("msg");
        var retry = document.getElementById("retry");
        var android = /Android/i.test(navigator.userAgent || "");

        /**
         * IMPORTANT: Do NOT use intent://…;scheme=https;… for Instagram/Facebook.
         * Many in-app WebViews treat that as “load https in this WebView” → Meta popup.
         * Only custom schemes (instagram://, fb://) leave the WebView to the real app.
         */
        function schemesFor(appKey, social) {
          social = social || {};
          if (appKey === "instagram") {
            var ig = social.instagram || "https://www.instagram.com/mrericssonpadeltournaments/";
            var user = "mrericssonpadeltournaments";
            try {
              var u = new URL(ig);
              user = (u.pathname.split("/").filter(Boolean)[0] || user).replace(/^@/, "");
            } catch (e) {}
            return {
              label: "Instagram",
              urls: [
                "instagram://user?username=" + encodeURIComponent(user),
                "intent://user?username=" +
                  encodeURIComponent(user) +
                  "#Intent;scheme=instagram;package=com.instagram.android;end",
              ],
            };
          }
          if (appKey === "facebook") {
            var fb = social.facebook || "https://www.facebook.com/profile.php?id=61594625726599";
            var id = "61594625726599";
            try {
              id = new URL(fb).searchParams.get("id") || id;
            } catch (e) {}
            return {
              label: "Facebook",
              urls: [
                "fb://page/" + id,
                "fb://profile/" + id,
                "intent://page/" + id + "#Intent;scheme=fb;package=com.facebook.katana;end",
                "intent://profile/" + id + "#Intent;scheme=fb;package=com.facebook.katana;end",
              ],
            };
          }
          if (appKey === "tiktok") {
            var tt = social.tiktok || "https://www.tiktok.com/@mr_ericsson";
            var handle = "mr_ericsson";
            try {
              var m = new URL(tt).pathname.match(/@([^/]+)/);
              if (m) handle = m[1];
            } catch (e) {}
            return {
              label: "TikTok",
              urls: [
                "tiktok://user?username=" + encodeURIComponent(handle),
                "snssdk1233://user/profile/" + encodeURIComponent(handle),
                "intent://user?username=" +
                  encodeURIComponent(handle) +
                  "#Intent;scheme=tiktok;package=com.zhiliaoapp.musically;end",
              ],
            };
          }
          if (appKey === "youtube") {
            return {
              label: "YouTube",
              urls: [
                "vnd.youtube://www.youtube.com/@MrEricssonDeveloper",
                "intent://www.youtube.com/@MrEricssonDeveloper#Intent;scheme=https;package=com.google.android.youtube;end",
              ],
            };
          }
          return null;
        }

        function tryOpen(urls) {
          if (!android || !urls || !urls.length) {
            msgEl.textContent =
              "Kunde inte öppna appen härifrån. Installera appen eller öppna den manuellt.";
            return;
          }
          // One scheme at a time. Never fall back to https://instagram.com / facebook.com.
          var i = 0;
          function next() {
            if (i >= urls.length) {
              msgEl.textContent =
                "Kunde inte öppna appen. Har du den installerad? Tryck igen, eller gå tillbaka.";
              return;
            }
            var url = urls[i++];
            var done = false;
            function finish() {
              if (done) return;
              done = true;
              document.removeEventListener("visibilitychange", onVis);
              clearTimeout(timer);
            }
            function onVis() {
              if (document.visibilityState === "hidden") finish();
            }
            document.addEventListener("visibilitychange", onVis);
            var timer = setTimeout(function () {
              finish();
              if (document.visibilityState === "visible") next();
            }, 600);
            // iframe only — never navigate this page to https://instagram.com
            // (intent+https is what produced Meta’s broken popup in WebViews)
            var iframe = document.createElement("iframe");
            iframe.style.display = "none";
            iframe.src = url;
            document.body.appendChild(iframe);
            setTimeout(function () {
              try {
                document.body.removeChild(iframe);
              } catch (e) {}
            }, 1500);
          }
          next();
        }

        if (!app) {
          titleEl.textContent = "Okänd länk";
          msgEl.textContent = "Gå tillbaka till katalogen.";
          retry.style.display = "none";
          return;
        }

        fetch("games.json?_=" + Date.now(), { cache: "no-store" })
          .then(function (r) {
            return r.ok ? r.json() : {};
          })
          .catch(function () {
            return {};
          })
          .then(function (data) {
            var t = schemesFor(app, data.social || {});
            if (!t) {
              titleEl.textContent = "Okänd länk";
              msgEl.textContent = "Gå tillbaka till katalogen.";
              retry.style.display = "none";
              return;
            }
            titleEl.textContent = "Öppna " + t.label;
            msgEl.textContent =
              "Öppnar " + t.label + "-appen… Om inget händer, tryck på knappen.";
            retry.textContent = "Öppna " + t.label;
            retry.onclick = function () {
              msgEl.textContent = "Försöker öppna " + t.label + " igen…";
              tryOpen(t.urls);
            };
            tryOpen(t.urls);
          });
      })();
    </script>
  </body>
</html>
